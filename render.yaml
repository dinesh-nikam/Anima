# Render Blueprint — Anima (Hobby / free tier)
#
# One-click infrastructure for the complete project: NestJS API + React studio +
# PostgreSQL + Redis, all on Render's Hobby plan at $0/month.
#
# Deploy (one-time, ~5 min):
#   1. http://render.com → New → Blueprint → connect the dinesh-nikam/Anima repo
#   2. Enter the four "sync: false" secrets when prompted (JWT_SECRET, ENCRYPTION_KEY,
#      GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET — see GitHub OAuth runbook)
#   3. Apply. Render provisions: anima-api (web), anima-frontend (static site),
#      anima-db (postgres), anima-redis (key-value)
#
# Resulting URLs:
#   Studio UI   https://anima-frontend.onrender.com
#   REST API    https://anima-api.onrender.com/api/v1
#   Swagger     https://anima-api.onrender.com/api/docs
#
# Free-tier caveats (Hobby plan):
#   - Postgres is DELETED 30 days after creation (+14-day grace). Run a pg_dump
#     before day 28, or the database and all user data are gone.
#   - Web service sleeps after 15 min idle (30-60 s cold start) and shares the
#     workspace's 750 instance-hour/month pool.
#   - Redis is 25 MB, in-memory only; data lost on restart (acceptable: the session
#     cookie itself carries the auth token).
#   - No persistent disk, no backups, no scaling. Upgrade per-service when needed
#     (Starter web $7/mo, Postgres $6/mo, KV $10/mo).

services:
  # ── NestJS API ────────────────────────────────────────────────────────────────
  - type: web
    name: anima-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run prisma:generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Browser origin that may call the API with credentials (same-site cookies).
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: static_site
          name: anima-frontend
          property: url
      # OAuth callback redirect target back to the studio dashboard.
      - key: FRONTEND_URL
        fromService:
          type: static_site
          name: anima-frontend
          property: url
      # GitHub OAuth callback — must match the redirect URL registered on the
      # GitHub OAuth App (developer settings).
      - key: GITHUB_CALLBACK_URL
        value: https://anima-api.onrender.com/api/v1/auth/github/callback
      - key: DATABASE_URL
        fromDatabase:
          name: anima-db
          property: connectionString
      - key: REDIS_URL
        fromKeyValue:
          name: anima-redis
          property: connectionString
      # Secrets — set once at blueprint creation (sync: false = no placeholder/CI value).
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  # ── React Studio (static site — free forever, zero instance hours) ──────────────
  - type: static_site
    name: anima-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    publishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Both API base-URL env names used by the frontend clients, baked at build time.
      - key: VITE_API_BASE_URL
        value: https://anima-api.onrender.com/api/v1
      - key: VITE_API_URL
        value: https://anima-api.onrender.com/api/v1

databases:
  - name: anima-db
    plan: free
    databaseName: anima
    user: anima

keyValues:
  - name: anima-redis
    plan: free